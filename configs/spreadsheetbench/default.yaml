_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium

train:
  train_size: 80
  batch_size: 40
  accumulation: 1

evaluation:
  test_env_num: 0

env:
  name: spreadsheetbench
  skill_init: graphskillevo/initial_skills/spreadsheetbench/init_skill.md
