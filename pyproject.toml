[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphskillevo"
version = "0.1.0"
description = "GraphSkillEvo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "azure-identity>=1.15.0",
    "azure-core>=1.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
alfworld = ["alfworld>=0.4.0", "gymnasium>=0.29.0"]
dev = ["ruff>=0.4.0"]

[tool.setuptools.packages.find]
include = ["graphskillevo", "graphskillevo.*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
